baseurl: "https://skl6174.github.io/"
enableEmoji: true
enableRobotsTXT: true
locale: "zh-cn"
title: "shenkl的小窝"
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"

permalinks:
  post: "/post/:year/:month/:day/:slug/"

menu:
  main:
    - name: 主页
      url: ""
      weight: 1
    - name: 关于
      url: "about/"
      weight: 2
    - name: 分类
      url: "categories/"
      weight: 3
    - name: 标签
      url: "tags/"
      weight: 4

params:
  description: "shenkl's blog"
  footer: "&copy; [shenkl] 2023 -- {Year} | [Github](https://github.com/) | [Bilibili](https://space.bilibili.com/)"
  toc: false
  tocTitle: "目录"
  showLastUpdated: false
  updatedDatePrefix: "上次更新"
  missingContentMessage: "页面不存在..."
  missingTitle: "页面不存在"
  missingBackButtonLabel: "返回首页"
  ogImage: "logo/og-default.png"

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
