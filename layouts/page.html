{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title | markdownify }}</h1>
    {{ partial "post-meta.html" . }}
  </header>

  {{ $showToc := or .Params.toc .Site.Params.toc }}
  {{ if and $showToc .TableOfContents }}
  <nav class="toc">
    <details open>
      <summary>{{ .Params.tocTitle | default .Site.Params.tocTitle | default "目录" }}</summary>
      {{ .TableOfContents }}
    </details>
  </nav>
  {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
