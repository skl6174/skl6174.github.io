<link rel="apple-touch-icon" sizes="180x180" href="{{ "logo/apple-touch-icon.png" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "logo/favicon-32x32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "logo/favicon-16x16.png" | relURL }}">
<link rel="shortcut icon" href="{{ "logo/favicon.ico" | relURL }}">
<link rel="manifest" href="{{ "logo/site.webmanifest" | relURL }}">

<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ if eq .Kind "404" }}{{ site.Params.missingTitle | default "页面不存在" }}{{ else if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="zh_CN">
{{ if .IsPage }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ end }}
{{ with site.Params.ogImage }}
<meta property="og:image" content="{{ . | absURL }}">
<meta name="twitter:image" content="{{ . | absURL }}">
{{ end }}
<meta name="twitter:card" content="{{ if site.Params.ogImage }}summary_large_image{{ else }}summary{{ end }}">
