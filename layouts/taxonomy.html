{{ define "main" }}
<div class="terms">
  <h1 class="page-title">{{ .Title | markdownify }}</h1>

  {{ with .Content }}
  <div class="list-content">
    {{ . }}
  </div>
  {{ end }}

  <ul class="term-list">
    {{ range .Pages.ByTitle }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="term-count">[{{ len .Pages }}]</span>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
